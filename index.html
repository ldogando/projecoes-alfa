  const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function unlock(pw){
    const enc = new TextEncoder();
    const km = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name:"PBKDF2", salt:b64d(ENCPKG.salt), iterations:ENCPKG.iter, hash:"SHA-256" },
      km, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64d(ENCPKG.iv) }, key, b64d(ENCPKG.ct));
    return new TextDecoder().decode(pt);
  }
  const f=document.getElementById("f"), e=document.getElementById("e"), b=document.getElementById("b");
  f.addEventListener("submit", async ev => {
    ev.preventDefault(); e.textContent=""; b.disabled=true; b.textContent="…";
    try {
      const html = await unlock(document.getElementById("pw").value);
      document.open(); document.write(html); document.close();
    } catch(err) {
      e.textContent = "Senha incorreta. Tente novamente.";
      b.disabled=false; b.textContent="Entrar";
      document.getElementById("pw").select();
    }
  });
